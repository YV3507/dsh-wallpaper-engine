name: verify

# 本仓的铁律是「提交前必须绿」，而 9,500+ 行守卫此前只能靠人记得在本机跑。
# 这个 workflow 把它变成机器事实：每次 push / PR 都跑同一套（build + verify + smoke）。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Windows：本项目的开发与发布平台；部分守卫还带平台条件分支（例如 unlink 用例
    # 在 win32 上只能断言「确实清除 + ENOENT 幂等」，POSIX 才断言 chmod 拦截），
    # 换平台会改变被断言的那一半。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 故意不跑 `npm ci`：build / verify / smoke 只 import `node:` 内置模块与相对路径，
      # 整条链对 registry 与 peer 解析免疫 —— 这条不变量由
      # test/verify-package-files.mjs 的 P5 断言钉住（谁往守卫里加裸依赖，本地就会先红）。
      # 装依赖只会引入 registry 抖动、peer 解析失败这两类与改动无关的红灯。
      - name: build —— 重建 lib/client.js
        run: npm run build

      - name: verify —— 结构性守卫（含正/负对照）
        run: npm run verify

      # media-bridge 的端到端那一段（P3-13 的残留项）：`verify` 链里那一步带 `--allow-skip`
      # ——缺前置时**显式**接受不跑（不是静默跳过），所以它在本机与 CI 都可能是"没跑"。
      # 这一条用 `--provision` 先把产物下载到自检缓存再**真跑**（中间件自带 `--provider mock`，
      # 不碰真播放器与系统音频权限，因此可 CI 化）；下载或断言失败即红，**不做
      # continue-on-error** —— "CI 覆盖了这条通道"的定义就是这一步会失败。
      # ⚠️ 这里曾写"本机给不出这条覆盖（下载被挡 / 沙箱里 spawn 是 EPERM）"——**下载那一半是错的**：
      # `provision.js` 用 `fetch` 下得下来且校验 sha256；只有"受限沙箱里带管道的 spawn 是 EPERM"成立。
      # 放开那道边界后本机同样是 30 通过 / 0 失败 ⇒ 这条自检**可以本机调试**，不要只盯着 CI。
      # 实测 CI（windows-latest）与本机的差异：同一个产物、同一套参数，本机 <25s 就拿到 `hello`，
      # runner 上 90s 也拿不到（存活、两路输出皆空）—— "冷启动慢"这个解释因此**不成立**，见下。
      #
      # **第三种结局：环境跳过**（不是通过，也不是红）。runner 上会出现「产物 sha256 正确、进程活着、
      # `hello` 不回、两路输出皆空」，这与"中间件/协议回归"表现**完全一样**，而处置相反。因此自检在
      # 握手失败时会跑一条**主动探针**（平凡调用能否换来响应）+ 校验**产物可信度**（sha256 是否就是
      # 发布产物）：只有"探针也说这个环境执行不了它 + 产物可信"才记环境跳过，并在日志末尾**点名这条
      # 通道本次没有断言覆盖**；探针说执行得了、或产物不可信，照旧判红。引导预算仍是 90s
      #（宿主侧 `DSH_WE_MEDIA_BOOT_MS` 可覆盖，**现场默认 25s**），失败行会带子进程两路输出与 spawn 姿势。
      - name: verify:bridge —— media-bridge 端到端（带 --provision）
        run: npm run verify:bridge

      - name: smoke —— 节点级冒烟
        run: npm run smoke

      # 软档（仓库内务 / 账本自洽 / 一次性清理的验收判据）：照跑、照打印 ✓/✗，但 **不拦 PR** ——
      # 详见 docs/DEV-GUIDE.md §4.2。`continue-on-error` 是这一档的定义本身，不是权宜：
      # 硬档的门槛是"能说出用户侧后果"，说不出后果的判据不该决定别人的改动能不会被合。
      # `verify:docs` 内部已经用 `test/warn-only.mjs` 把每条守卫的退出码降级并打印原码；
      # 这里再加一层是**双保险**（CI 上若有人改坏了那层包装，这步仍不会变红）。
      - name: verify:docs —— 软档（不拦 PR，只看结论）
        continue-on-error: true
        run: npm run verify:docs

      # src/client.js 改了却没重建产物 ⇒ 发出去的是旧行为（CONTRIBUTING 的 PR 清单
      # 要求源码与产物同时包含，这一条把它变成机器判定）。
      - name: lib/client.js 与 src/client.js 同步
        run: git diff --exit-code -- lib/client.js

      - name: 无尾随空白 / 冲突标记
        run: git diff --check
